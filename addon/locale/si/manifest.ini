summary = "AbsoluteYoutube"
description = """YouTube වීඩියෝ MP3, MP4 සහ WAV ලෙස බාගත කරන්න. නැවත ආරම්භ කිරීම, ක්ලිප් කැපීම, ස්නැප්ෂොට්, කෙටි URL පිටපත් කිරීම සහ ස්මාර්ට් අසාර්ථක බාගත කිරීම් කළමනාකරු සමඟ - NVDA පරිශීලකයින් සඳහා වේගවත් සහ ප්‍රවේශ විය හැකිය.
ඔබට එය ක්ෂණිකව ලබා ගත හැකි විට වීඩියෝ පිටුවක් විවෘත කිරීමට කාලය නාස්ති කරන්නේ ඇයි? අපගේ නවතම යාවත්කාලීනය විප්ලවීය Focus and Fetch විශේෂාංගය හඳුන්වා දෙයි. ඕනෑම වීඩියෝ සබැඳියක් මත ඔබේ කර්සරය යොමු කර වහාම ඔබේ බාගත කිරීම ආරම්භ කරන්න - පිටු පූරණය වන තෙක් තවදුරටත් බලා සිටීමට අවශ්‍ය නැත.
අලුත් මොනවාද:
ක්ෂණික බාගත කිරීමේ මාදිලිය මාරු කරන්න
බාගත ලැයිස්තු කළමනාකරු
ප්‍රියතම නාලිකාව
YouTube සොයන්න
හොට් කීස්:
- NVDA+Y
එක් වරක් තට්ටු කිරීම: MP3 බාගන්න
දෙවරක් තට්ටු කිරීම: MP4 බාගන්න
තෙවරක් තට්ටු කිරීම: WAV බාගන්න
- CTRL+Shift+Y
එක් වරක් තට්ටු කිරීම: සන්දර්භය මෙනුව විවෘත කරන්න
දෙවරක් තට්ටු කිරීම: ගමනාන්ත ෆෝල්ඩරය විවෘත කරන්න
තෙවරක් තට්ටු කිරීම: වීඩියෝ සොයන්න
NVDA+CTRL+Y: ක්ෂණික බාගත කිරීමේ මාදිලිය මාරු කරන්න
NVDA+Shift+Y: ධාවන ලැයිස්තු මාදිලිය මාරු කරන්න
- ALT+Windows+Y: MP3 ගුණාත්මකභාවය වෙනස් කරන්න"""