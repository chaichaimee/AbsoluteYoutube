summary = "AbsoluteYoutube"
description = """Preuzmite YouTube videozapise kao MP3, MP4 i WAV s nastavkom, obrezivanjem isječaka, snimkama zaslona, kopiranjem kratkih URL-ova i pametnim upraviteljem neuspjelih preuzimanja - brzo i dostupno za korisnike NVDA.
Zašto gubiti vrijeme na otvaranje stranice videa kada ga možete zgrabiti odmah? Naše najnovije ažuriranje uvodi revolucionarnu značajku Focus and Fetch. Jednostavno fokusirajte kursor na bilo koju poveznicu videozapisa i odmah pokrenite preuzimanje - nema više čekanja da se stranice učitaju.
Što je novo:
Prebacivanje načina trenutnog preuzimanja
Upravitelj popisa preuzimanja
Omiljeni kanal
Pretraživanje YouTubea
Vruće tipke:
- NVDA+Y
Jedan dodir: Preuzmi MP3
Dvostruki dodir: Preuzmi MP4
Trostruki dodir: Preuzmi WAV
- CTRL+Shift+Y
Jedan dodir: Otvori kontekstni izbornik
Dvostruki dodir: Otvori odredišnu mapu
Trostruki dodir: Pretraži video
NVDA+CTRL+Y: Prebacivanje načina trenutnog preuzimanja
NVDA+Shift+Y: Prebacivanje načina popisa pjesama
- ALT+Windows+Y: Kružna promjena MP3 kvalitete"""