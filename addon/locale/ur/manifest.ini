summary = "AbsoluteYoutube"
description = """یوٹیوب ویڈیوز کو MP3، MP4 اور WAV کے طور پر ڈاؤن لوڈ کریں بشمول ریزیوم، ٹرم کلپس، اسنیپ شاٹس، مختصر URL کاپی، اور سمارٹ فیلڈ ڈاؤن لوڈ مینیجر - NVDA صارفین کے لیے تیز اور قابل رسائی۔
جب آپ اسے فوری طور پر حاصل کر سکتے ہیں تو ویڈیو پیج کھولنے میں وقت کیوں ضائع کریں؟ ہماری تازہ ترین اپ ڈیٹ انقلابی Focus and Fetch فیچر متعارف کرواتی ہے۔ بس اپنے کرسر کو کسی بھی ویڈیو لنک پر فوکس کریں اور اپنا ڈاؤن لوڈ فوری طور پر شروع کریں - اب پیجز لوڈ ہونے کا انتظار کرنے کی ضرورت نہیں ہے۔
نیا کیا ہے:
فوری ڈاؤن لوڈ موڈ کو ٹوگل کریں
ڈاؤن لوڈ لسٹ مینیجر
پسندیدہ چینل
یوٹیوب سرچ
ہاٹ کیز:
- NVDA+Y
ایک بار ٹیپ کریں: MP3 ڈاؤن لوڈ کریں
دو بار ٹیپ کریں: MP4 ڈاؤن لوڈ کریں
تین بار ٹیپ کریں: WAV ڈاؤن لوڈ کریں
- CTRL+Shift+Y
ایک بار ٹیپ کریں: سیاق و سباق مینو کھولیں
دو بار ٹیپ کریں: منزل کا فولڈر کھولیں
تین بار ٹیپ کریں: ویڈیو تلاش کریں
NVDA+CTRL+Y: فوری ڈاؤن لوڈ موڈ کو ٹوگل کریں
NVDA+Shift+Y: پلے لسٹ موڈ کو ٹوگل کریں
- ALT+Windows+Y: MP3 کوالٹی تبدیل کریں"""