summary = "앱솔루트 유튜브"
description = """비디오 페이지를 열며 시간을 낭비할 필요가 없습니다. 즉시 가져오세요! 최신 업데이트에서 혁신적인 '포커스 앤 훧(Focus and Fetch)' 기능이 도입되었습니다. 비디오 링크에 커서를 맞추고 즉시 다운로드를 실행하세요. 페이지가 로드될 때까지 기다릴 필요가 없습니다.
Absolute YouTube은 NVDA 사용자가 유튜브 콘텐츠를 손쉽게 검색, 다운로드 및 관리할 수 있도록 해줍니다. MP3, MP4 또는 WAV 형식으로 오디오와 비디오를 다운로드하세요. 클립 자르기, 썸네일 저장, 즐겨찾는 채널 관리, 다운로드 대기열 추가, NVDA에서 직접 유튜브 검색 등의 기능을 제공합니다.
단축키:
NVDA+Y
한 번 탭: MP3 다운로드
두 번 탭하기: MP4 다운로드
세 번 탭하기: WAV 다운로드

CTRL+Shift+Y
한 번 탭: 컨텍스트 메뉴 열기
두 번 탭: 대상 폴더 열기
삼중 탭: 동영상 검색

NVDA+CTRL+Y: 즉시 다운로드 모드 전환
NVDA+Shift+Y: 재생목록 모드 전환
- ALT+Windows+Y: MP3 품질 순환 전환"""