summary = "앱솔루트유튜브"
description = """비디오 페이지를 여는 데 시간을 낭비하지 말고 즉시 다운로드하세요! 최신 업데이트에서는 혁신적인 포커스 앤 펫치 기능이 도입되었습니다. 비디오 링크에 커서를 맞추고 즉시 다운로드를 실행하면 페이지가 로드될 때 더 이상 기다릴 필요가 없습니다.
앱솔루트 유튜브를 사용하면 NVDA 사용자가 유튜브 콘텐츠를 손쉽게 검색, 다운로드 및 관리할 수 있습니다. MP3, MP4 또는 WAV 형식으로 오디오와 비디오를 다운로드하세요. 클립 자르기, 썸네일 저장, 즐겨찾는 채널 관리, 다운로드 대기열 추가, NVDA에서 직접 유튜브 검색 등의 기능을 제공합니다.
단축키:
NVDA+Y
한 번 누르기: MP3 다운로드
두 번 누르기: MP4 다운로드
세 번 누르기: WAV 다운로드

CTRL+Shift+Y
한 번 누르기: 컨텍스트 메뉴 열기
두 번 누르기: 대상 폴더 열기
세 번 누르기: 비디오 검색

NVDA+CTRL+Y: 즉시 다운로드 모드 전환
NVDA+Shift+Y: 재생 목록 모드 전환
- ALT+Windows+Y: MP3 품질 순환 변경"""