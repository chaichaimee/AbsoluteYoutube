즉시 다운로드 모드 토글
다운로드 목록 관리자
즐겨찾는 채널
YouTube 검색
단축키:
- NVDA+Y
한 번 누르기: MP3 다운로드
두 번 누르기: MP4 다운로드
세 번 누르기: WAV 다운로드
- CTRL+Shift+Y
한 번 누르기: 컨텍스트 메뉴 열기
두 번 누르기: 대상 폴더 열기
세 번 누르기: 동영상 검색
NVDA+CTRL+Y: 즉시 다운로드 모드 토글
NVDA+Shift+Y: 재생 목록 모드 토글
- ALT+Windows+Y: MP3 음질 순환"""