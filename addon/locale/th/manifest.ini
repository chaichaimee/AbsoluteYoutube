summary = "AbsoluteYoutube"
description = """ดาวน์โหลดวิดีโอ YouTube เป็น MP3, MP4 และ WAV พร้อมฟีเจอร์ดาวน์โหลดต่อ, ตัดคลิป, จับภาพสแนปชอต, คัดลอก URL สั้น และระบบจัดการการดาวน์โหลดที่ล้มเหลวแบบอัจฉริยะ - รวดเร็วและเข้าถึงได้ง่ายสำหรับผู้ใช้ NVDA
ทำไมต้องเสียเวลาเปิดหน้าวิดีโอในเมื่อคุณสามารถโหลดได้ทันที? การอัปเดตล่าสุดของเราขอเสนอคุณสมบัติ Focus and Fetch ที่ปฏิวัติวงการ เพียงวางโฟกัสเคอร์เซอร์ของคุณบนลิงก์วิดีโอใดๆ และเริ่มการดาวน์โหลดทันที - ไม่ต้องรอให้โหลดหน้าเว็บอีกต่อไป
มีอะไรใหม่:
เปิด/ปิด โหมดดาวน์โหลดทันที
ระบบจัดการรายการดาวน์โหลด
ช่องโปรด
ค้นหา Youtube
ปุ่มลัด:
- NVDA+Y
กดหนึ่งครั้ง: ดาวน์โหลด MP3
กดสองครั้ง: ดาวน์โหลด MP4
กดสามครั้ง: ดาวน์โหลด WAV
- CTRL+Shift+Y
กดหนึ่งครั้ง: เปิดเมนูบริบท
กดสองครั้ง: เปิดโฟลเดอร์ปลายทาง
กดสามครั้ง: ค้นหาวิดีโอ
NVDA+CTRL+Y: เปิด/ปิด โหมดดาวน์โหลดทันที
NVDA+Shift+Y: เปิด/ปิด โหมดเพลย์ลิสต์
- ALT+Windows+Y: สลับคุณภาพ MP3"""