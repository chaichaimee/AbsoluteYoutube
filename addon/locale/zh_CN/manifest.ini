summary = "AbsoluteYoutube"
description = """为什么要浪费时间打开视频页面？最新更新引入了革命性的“聚焦即取”功能。只需将光标聚焦于任何视频链接并立即触发下载，无需再等待页面加载。
Absolute YouTube 让 NVDA 用户能够轻松搜索、下载和管理 YouTube 内容。支持以 MP3、MP4 或 WAV 格式下载音频和视频。功能包括裁剪片段、保存缩略图、管理收藏频道、排队下载以及直接从 NVDA 搜索 YouTube。

热键：
NVDA+Y
单击：下载 MP3
双击：下载 MP4
三击：下载 WAV

CTRL+Shift+Y
单击：打开上下文菜单
双击：打开目标文件夹
三击：搜索视频

NVDA+CTRL+Y
单击：下载列表
双击：下载失败
三击：视频历史报告

NVDA+Shift+Y
单击：保存描述
双击：保存字幕
三击：自动朗读 YouTube 字幕

ALT+Windows+Y
单击：切换 MP3 音质
双击：切换即时下载模式
三击：切换播放列表模式

Z（在 YouTube 页面上）
跳过正在播放的广告"""