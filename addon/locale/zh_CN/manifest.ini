summary = "AbsoluteYoutube"
description = """为什么要在打开视频页面上浪费时间，直接一键获取不就行了？我们的最新更新推出了革命性的“聚焦并获取”功能。只需将光标聚焦在任意视频链接上即可立即触发下载——无需再等待页面加载。
Absolute YouTube 允许 NVDA 用户轻松搜索、下载和管理 YouTube 内容。支持下载 MP3、MP4 或 WAV 格式的音频和视频。功能包括裁剪剪辑、保存缩略图、管理收藏频道、排队下载以及直接从 NVDA 搜索 YouTube。
快捷键：
NVDA+Y
单击：下载 MP3
双击：下载 MP4
三击：下载 WAV

CTRL+Shift+Y
单击：打开上下文菜单
双击：打开目标文件夹
三击：搜索视频

NVDA+CTRL+Y：切换即时下载模式
NVDA+Shift+Y：切换播放列表模式
- ALT+Windows+Y：循环切换 MP3 音质"""