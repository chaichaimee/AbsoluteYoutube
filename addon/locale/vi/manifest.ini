summary = "AbsoluteYoutube"
description = """Tải xuống video YouTube dưới dạng MP3, MP4 và WAV với tính năng tiếp tục tải, cắt clip, chụp ảnh màn hình, sao chép URL ngắn và trình quản lý tải xuống lỗi thông minh - nhanh chóng & dễ tiếp cận cho người dùng NVDA.
Tại sao phải lãng phí thời gian mở trang video khi bạn có thể tải nó ngay lập tức? Bản cập nhật mới nhất của chúng tôi giới thiệu tính năng Focus and Fetch mang tính cách mạng. Chỉ cần tập trung con trỏ vào bất kỳ liên kết video nào và kích hoạt tải xuống ngay lập tức - không còn phải chờ đợi trang tải xong.
Có gì mới:
Chuyển đổi chế độ tải xuống ngay lập tức
Trình quản lý danh sách tải xuống
Kênh yêu thích
Tìm kiếm Youtube
Phím nóng:
- NVDA+Y
Nhấn một lần: Tải xuống MP3
Nhấn hai lần: Tải xuống MP4
Nhấn ba lần: Tải xuống WAV
- CTRL+Shift+Y
Nhấn một lần: Mở Menu ngữ cảnh
Nhấn hai lần: Mở Thư mục đích
Nhấn ba lần: Tìm kiếm Video
NVDA+CTRL+Y: Chuyển đổi chế độ tải xuống ngay lập tức
NVDA+Shift+Y: Chuyển đổi chế độ danh sách phát
- ALT+Windows+Y: Thay đổi chất lượng MP3"""