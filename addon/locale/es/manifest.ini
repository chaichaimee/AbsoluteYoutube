summary = "AbsoluteYoutube"
description = """¿Por qué perder tiempo abriendo la página de un vídeo cuando puedes obtenerlo al instante? Nuestra última actualización introduce la revolucionaria función Enfocar y Obtener. Simplemente sitúa el cursor en cualquier enlace de vídeo e inicia la descarga de inmediato; olvídate de esperar a que carguen las páginas.
Absolute YouTube permite a los usuarios de NVDA buscar, descargar y gestionar contenido de YouTube sin esfuerzo. Descarga audio y vídeo en formatos MP3, MP4 o WAV. Sus funciones incluyen recortar clips, guardar miniaturas, gestionar canales favoritos, poner descargas en cola y buscar en YouTube directamente desde NVDA.

Teclas de acceso rápido:
NVDA+Y
Una pulsación: Descargar MP3
Doble pulsación: Descargar MP4
Triple pulsación: Descargar WAV

CTRL+Shift+Y
Una pulsación: Abrir menú contextual
Doble pulsación: Abrir carpeta de destino
Triple pulsación: Buscar vídeo

NVDA+CTRL+Y
Una pulsación: Lista de descargas
Doble pulsación: Descargas fallidas
Triple pulsación: Informe de historial de vídeos

NVDA+Shift+Y
Una pulsación: Guardar descripción
Doble pulsación: Guardar subtítulos
Triple pulsación: Leer subtítulos de YouTube automáticamente

ALT+Windows+Y
Pulsación simple: Cambiar calidad de MP3
Doble pulsación: Alternar modo de descarga inmediata
Triple pulsación: Alternar modo de lista de reproducción

Z (en páginas de YouTube)
Omitir el anuncio que se está reproduciendo"""