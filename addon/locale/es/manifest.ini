summary = "AbsoluteYoutube"
description = """¿Por qué perder tiempo abriendo una página de vídeo cuando puedes obtenerlo al instante? Nuestra última actualización introduce la revolucionaria función Enfocar y Obtener. Simplemente sitúa el cursor en cualquier enlace de vídeo e inicia tu descarga de inmediato, sin esperar a que carguen las páginas.
Absolute YouTube permite a los usuarios de NVDA buscar, descargar y gestionar contenido de YouTube sin esfuerzo. Descarga audio y vídeo en formatos MP3, MP4 o WAV. Sus funciones incluyen recortar clips, guardar miniaturas, gestionar canales favoritos, poner descargas en cola y buscar en YouTube directamente desde NVDA.

Teclas de acceso rápido:
NVDA+Y
Pulsación simple: Descargar MP3
Pulsación doble: Descargar MP4
Pulsación triple: Descargar WAV

CTRL+Shift+Y
Pulsación simple: Abrir menú contextual
Pulsación doble: Abrir carpeta de destino
Pulsación triple: Buscar vídeo

NVDA+CTRL+Y
Pulsación simple: Lista de descargas
Pulsación doble: Descargas fallidas
Pulsación triple: Informe de historial de vídeos

NVDA+Shift+Y
Pulsación simple: Guardar descripción
Pulsación doble: Guardar subtítulos
Pulsación triple: Leer subtítulos de YouTube automáticamente

ALT+Windows+Y
Pulsación simple: Cambiar calidad de MP3
Doble pulsación: Alternar modo de descarga inmediata
Triple pulsación: Alternar modo de lista de reproducción

Z (en páginas de YouTube)
Omitir el anuncio que se está reproduciendo"""