summary = "AbsoluteYoutube"
description = """動画ページを開く手間を省き、すぐにダウンロードできるようになりました。最新のアップデートでは、革新的な「フォーカス＆フェッチ」機能が導入されています。動画リンクにカーソルを合わせるだけで、ページの読み込みを待つことなく、すぐにダウンロードを開始できます。
Absolute YouTubeを使用すると、NVDAユーザーはYouTubeコンテンツを簡単に検索、ダウンロード、管理できます。MP3、MP4、WAV形式での音声および動画のダウンロードに対応しています。クリップのトリミング、サムネイルの保存、お気に入りチャンネルの管理、ダウンロードのキューイング、NVDAからの直接YouTube検索などの機能を備えています。

ホットキー:
NVDA+Y
1回タップ: MP3をダウンロード
2回タップ: MP4をダウンロード
3回タップ: WAVをダウンロード

CTRL+Shift+Y
1回タップ: コンテキストメニューを開く
2回タップ: 保存先フォルダを開く
3回タップ: 動画を検索

NVDA+CTRL+Y
1回タップ: ダウンロードリスト
2回タップ: 失敗したダウンロード
3回タップ: 動画履歴レポート

NVDA+Shift+Y
1回タップ: 説明を保存
2回タップ: 字幕を保存
3回タップ: YouTubeの字幕を自動的に読み上げる

ALT+Windows+Y
シングルタップ : MP3品質を切り替え
ダブルタップ : 即座ダウンロードモードを切り替え
トリプルタップ : プレイリストモードを切り替え

Z (YouTubeページ上)
再生中の広告をスキップ"""