summary = "AbsoluteYoutube"
description = """動画ページを開く手間を省き、すぐにダウンロードできるようになりました。最新アップデートでは、革新的な「フォーカス＆フェッチ」機能が追加されました。動画リンクにカーソルを合わせるだけで、ページの読み込みを待たずにすぐにダウンロードを開始できます。
Absolute YouTubeを使用すると、NVDAユーザーはYouTubeのコンテンツを簡単に検索、ダウンロード、管理できます。MP3、MP4、WAV形式での音声および動画のダウンロードが可能です。クリップのトリミング、サムネイルの保存、お気に入りチャンネルの管理、ダウンロードのキューイング、NVDAからの直接YouTube検索などの機能を備えています。
ホットキー:
NVDA+Y
1回タップ: MP3をダウンロード
2回タップ: MP4をダウンロード
3回タップ: WAVをダウンロード

CTRL+Shift+Y
1回タップ: コンテキストメニューを開く
2回タップ: 保存先フォルダを開く
3回タップ: 動画を検索

NVDA+CTRL+Y : 即時ダウンロードモードの切り替え
NVDA+Shift+Y: プレイリストモードの切り替え
- ALT+Windows+Y: MP3の品質を切り替え"""