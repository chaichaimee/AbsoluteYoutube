summary = "AbsoluteYoutube"
description = """YouTube動画をMP3、MP4、WAVとしてダウンロード。レジューム、クリップのトリミング、スナップショット、短縮URLのコピー、スマートなダウンロード失敗管理機能を備え、NVDAユーザーにとって高速でアクセシブルです。
動画ページを開くのに時間を無駄にする必要はありません。最新のアップデートでは、革新的な「Focus and Fetch」機能を導入しました。ビデオリンクにカーソルを合わせるだけで、すぐにダウンロードを開始できます。ページの読み込みを待つ必要はもうありません。
新機能：
即時ダウンロードモードの切り替え
ダウンロードリストマネージャー
お気に入りチャンネル
YouTube検索
ホットキー：
- NVDA+Y
シングルタップ：MP3をダウンロード
ダブルタップ：MP4をダウンロード
トリプルタップ：WAVをダウンロード
- CTRL+Shift+Y
シングルタップ：コンテキストメニューを開く
ダブルタップ：保存先フォルダーを開く
トリプルタップ：ビデオを検索
NVDA+CTRL+Y：即時ダウンロードモードの切り替え
NVDA+Shift+Y：プレイリストモードの切り替え
- ALT+Windows+Y：MP3品質の切り替え"""