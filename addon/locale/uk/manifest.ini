Гарячі клавіші:
NVDA+Y
Одиночне натискання: Завантажити MP3
Подвійне натискання: Завантажити MP4
Потрійне натискання: Завантажити WAV

CTRL+Shift+Y
Одиночне натискання: Відкрити контекстне меню
Подвійне натискання: Відкрити папку призначення
Потрійне натискання: Шукати відео

NVDA+CTRL+Y
Одиночне натискання: Список завантажень
Подвійне натискання: Невдалі завантаження
Потрійне натискання: Звіт про історію відео

NVDA+Shift+Y
Одиночне натискання: Зберегти опис
Подвійне натискання: Зберегти субтитри
Потрійне натискання: Читати субтитри YouTube автоматично

ALT+Windows+Y
Один дотик: перемикнути якість MP3
Подвійний дотик: увімкнути або вимкнути режим негайного завантаження
Потрійний дотик: увімкнути або вимкнути режим списку відтворення

