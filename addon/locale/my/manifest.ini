description = """YouTube ဗီဒီယိုများကို MP3, MP4 နှင့် WAV အဖြစ် ဒေါင်းလုဒ်လုပ်ပါ။ ပြန်လည်စတင်ခြင်း၊ ကလစ်ဖြတ်ခြင်း၊ စနက်ရှော့ရိုက်ခြင်း၊ URL အတိုကူးယူခြင်းနှင့် ပျက်ကွက်သောဒေါင်းလုဒ်များကို စမတ်ကျကျစီမံခန့်ခွဲခြင်း - NVDA အသုံးပြုသူများအတွက် မြန်ဆန်ပြီး အလွယ်တကူအသုံးပြုနိုင်ပါသည်။
ဗီဒီယိုကို ချက်ချင်းရနိုင်ချိန်တွင် ဗီဒီယိုစာမျက်နှာကိုဖွင့်ပြီး အချိန်အဘယ်ကြောင့်ဖြုန်းနေမည်နည်း။ ကျွန်ုပ်တို့၏နောက်ဆုံးထွက်အပ်ဒိတ်တွင် တော်လှန်သော Focus and Fetch လုပ်ဆောင်ချက်ကို မိတ်ဆက်ပေးထားပါသည်။ ဗီဒီယိုလင့်ခ်တစ်ခုခုပေါ်တွင် ကာဆာကိုထားရှိရုံဖြင့် ဒေါင်းလုဒ်ကို ချက်ချင်းစတင်နိုင်ပါသည် - စာမျက်နှာများပွင့်လာသည်အထိ စောင့်ရန်မလိုတော့ပါ။
အသစ်ပါဝင်သောအရာများ-
ချက်ချင်းဒေါင်းလုဒ်လုပ်မည့်မုဒ်ကို ပြောင်းရန်
ဒေါင်းလုဒ်စာရင်း စီမံခန့်ခွဲသူ
နှစ်သက်သောချန်နယ်
YouTube ရှာဖွေရန်
ဖြတ်လမ်းခလုတ်များ-
- NVDA+Y
တစ်ချက်နှိပ်ရန်- MP3 ဒေါင်းလုဒ်လုပ်ရန်
နှစ်ချက်နှိပ်ရန်- MP4 ဒေါင်းလုဒ်လုပ်ရန်
သုံးချက်နှိပ်ရန်- WAV ဒေါင်းလုဒ်လုပ်ရန်
- CTRL+Shift+Y
တစ်ချက်နှိပ်ရန်- ကွန်တက်မီနူးဖွင့်ရန်
နှစ်ချက်နှိပ်ရန်- သိမ်းဆည်းသည့်ဖိုင်တွဲကိုဖွင့်ရန်
သုံးချက်နှိပ်ရန်- ဗီဒီယိုရှာဖွေရန်
NVDA+CTRL+Y- ချက်ချင်းဒေါင်းလုဒ်လုပ်မည့်မုဒ်ကို ပြောင်းရန်
NVDA+Shift+Y- ပလေးလစ်မုဒ်ကို ပြောင်းရန်
- ALT+Windows+Y- MP3 အရည်အသွေးကို ပြောင်းရန်"""