summary = "AbsoluteYoutube"
description = """YouTube வீடியோக்களை MP3, MP4 மற்றும் WAV வடிவில் தரவிறக்கம் செய்யுங்கள். மீண்டும் தொடங்குதல், கிளிப்களை வெட்டுதல், ஸ்னாப்ஷாட்கள், குறுகிய URL நகல் மற்றும் ஸ்மார்ட் தோல்வியுற்ற தரவிறக்க மேலாளர் - NVDA பயனர்களுக்கு வேகமானது மற்றும் அணுகக்கூடியது.
வீடியோ பக்கத்தைத் திறந்து நேரத்தை ஏன் வீணாக்க வேண்டும்? எங்களின் சமீபத்திய அப்டேட் புரட்சிகரமான Focus and Fetch அம்சத்தை அறிமுகப்படுத்துகிறது. எந்தவொரு வீடியோ இணைப்பிலும் உங்கள் கர்சரை வைத்து உடனடியாக தரவிறக்கத்தைத் தொடங்குங்கள் - பக்கங்கள் ஏற்றப்படும் வரை காத்திருக்க வேண்டியதில்லை.
புதியவை:
உடனடி தரவிறக்க பயன்முறையை மாற்றவும்
தரவிறக்கப் பட்டியல் மேலாளர்
பிடித்த சேனல்
YouTube தேடல்
ஹாட் கீஸ்:
- NVDA+Y
ஒற்றை தட்டல்: MP3 தரவிறக்கம்
இரட்டை தட்டல்: MP4 தரவிறக்கம்
மும்முறை தட்டல்: WAV தரவிறக்கம்
- CTRL+Shift+Y
ஒற்றை தட்டல்: சூழல் மெனுவைத் திற
இரட்டை தட்டல்: இலக்கு கோப்புறையைத் திற
மும்முறை தட்டல்: வீடியோவைத் தேடு
NVDA+CTRL+Y: உடனடி தரவிறக்க பயன்முறையை மாற்றவும்
NVDA+Shift+Y: பிளேலிஸ்ட் பயன்முறையை மாற்றவும்
- ALT+Windows+Y: MP3 தரத்தை மாற்றவும்"""