summary = "絕對 YouTube"
description = """為什麼要浪費時間開啟影片頁面才能取得連結？我們最新的更新推出了革命性的「聚焦與抓取」功能。只要將游標聚焦在任何影片連結上並立即觸發下載，就不必再等待頁面載加。
絕對 YouTube 讓 NVDA 使用者能夠輕鬆搜尋、下載和管理 YouTube 內容。以 MP3、MP4 或 WAV 格式下載音訊與影片。功能包括剪輯片段、儲存縮圖、管理最愛頻道、將下載加入佇列，以及直接從 NVDA 搜尋 YouTube。

熱鍵：
NVDA+Y
按一下：下載 MP3
按兩下：下載 MP4
按三下：下載 WAV

CTRL+Shift+Y
按一下：開啟內容功能表
按兩下：開啟目標資料夾
按三下：搜尋影片

NVDA+CTRL+Y
按一下：下載清單
按兩下：下載失敗
按三下：影片歷史記錄報告

NVDA+Shift+Y
按一下：儲存說明
按兩下：儲存字幕
按三下：自動讀取 YouTube 字幕

ALT+Windows+Y
單擊：切換 MP3 品質
雙擊：切換立即下載模式
三擊：切換播放清單模式

Z（在 YouTube 頁面上）
跳過正在播放的廣告"""