summary = "AbsoluteYoutube"
description = """將 YouTube 影片下載為 MP3、MP4 和 WAV 格式，支援斷點續傳、剪輯裁剪、快照、短網址複製以及智慧失敗下載管理 - 為 NVDA 使用者提供快速且無障礙的體驗。
既然可以立即獲取，為什麼還要浪費時間打開影片頁面呢？我們的最新更新引入了革命性的 Focus and Fetch 功能。只需將游標聚焦在任何影片連結上並立即觸發下載 - 無需再等待頁面載入。
更新內容：
切換立即下載模式
下載列表管理器
收藏頻道
搜尋 YouTube
快速鍵：
- NVDA+Y
單擊：下載 MP3
雙擊：下載 MP4
三擊：下載 WAV
- CTRL+Shift+Y
單擊：打開快顯功能表
雙擊：打開目標資料夾
三擊：搜尋影片
NVDA+CTRL+Y：切換立即下載模式
NVDA+Shift+Y：切換播放清單模式
- ALT+Windows+Y：循環切換 MP3 音質"""