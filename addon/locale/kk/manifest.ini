description = """YouTube бейнелерін MP3, MP4 және WAV ретінде жүктеп алыңыз. Жүктеуді жалғастыру, клиптерді қию, скриншоттар, қысқа URL мекенжайын көшіру және сәтсіз жүктеулерді ақылды басқару - NVDA пайдаланушылары үшін жылдам және қолжетімді.
Бейнені бірден алуға болатын кезде бейне бетін ашуға неге уақыт жоғалту керек? Соңғы жаңартуымыз революциялық Focus and Fetch мүмкіндігін ұсынады. Курсорды кез келген бейне сілтемесіне қойып, жүктеуді бірден бастаңыз - беттердің жүктелуін күтудің қажеті жоқ.
Жаңалықтар:
Жедел жүктеу режимін қосу/өшіру
Жүктеулер тізімінің менеджері
Таңдаулы арна
YouTube-тен іздеу
Ыстық пернелер:
- NVDA+Y
Бір рет басу: MP3 жүктеу
Екі рет басу: MP4 жүктеу
Үш рет басу: WAV жүктеу
- CTRL+Shift+Y
Бір рет басу: Мәнмәтіндік мәзірді ашу
Екі рет басу: Тағайындалған қалтаны ашу
Үш рет басу: Бейнені іздеу
NVDA+CTRL+Y: Жедел жүктеу режимін қосу/өшіру
NVDA+Shift+Y: Ойнату тізімі режимін қосу/өшіру
- ALT+Windows+Y: MP3 сапасын өзгерту"""