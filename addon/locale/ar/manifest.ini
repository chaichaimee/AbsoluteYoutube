summary = "يوتيوب المطلق"
description = """لماذا تضيع وقتك في فتح صفحة فيديو بينما يمكنك تحميله فورياً؟ يقدم تحديثنا الأخير ميزة "التركيز والتحجيم" الثورية. فقط ضع مؤشرك على أي رابط فيديو وابدأ التنزيل فوراً - لا داعي بعد الآن للانتظار حتى تحمّل الصفحات.
يتيح يوتيوب المطلق لمستخدمي NVDA البحث عن محتوى يوتيوب وتنزيله وإدارته بكل سهولة. قم بتنزيل الصوت والفيديو بتصاميم MP3، أو MP4، أو WAV. تشمل الميزات قص المقاطع، وحفظ الصور المصغرة، وإدارة القنوات المفضلة، وقوائم انتظار التنزيل، والبحث في يوتيوب مباشرة من NVDA.

مفاتيح الاختصار:
NVDA+Y
ضغطة واحدة: تنزيل بصيغة MP3
ضغطتان: تنزيل بصيغة MP4
ثلاث ضغطات: تنزيل بصيغة WAV

CTRL+Shift+Y
ضغطة واحدة: فتح القائمة السياقية
ضغطتان: فتح مجلد الوجهة
ثلاث ضغطات: البحث عن فيديو

NVDA+CTRL+Y
ضغطة واحدة: قائمة التنزيلات
ضغطتان: التنزيلات الفاشلة
ثلاث ضغطات: تقرير سجل الفيديوهات

NVDA+Shift+Y
ضغطة واحدة: حفظ الوصف
ضغطتان: حفظ الترجمة
ثلاث ضغطات: قراءة ترجمات يوتيوب تلقائياً

ALT+Windows+Y
نقرة واحدة: تبديل جودة MP3
نقرة مزدوجة: تبديل وضع التنزيل الفوري
ثلاث نقرات: تبديل وضع قائمة التشغيل

Z (في صفحة يوتيوب)
تخطي الإعلان قيد التشغيل"""