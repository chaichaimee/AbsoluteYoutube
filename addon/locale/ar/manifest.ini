summary = "يوتيوب المطلق"
description = """لماذا تضيع وقتك في فتح صفحة فيديو بينما يمكنك تحميله فورياً؟ يقدم آخر تحديث لنا ميزة التركيز والجلب الثورية. كل ما عليك فعله هو تركيز مؤشرك على أي رابط فيديو وبدء التحميل فوراً - لا مزيد من الانتظار لتحميل الصفحات.
يتيح يوتيوب المطلق لمستخدمي NVDA البحث عن محتوى يوتيوب، وتحميله، وإدارته بكل سهولة. قم بتحميل الصوت والفيديو بصيغ MP3 أو MP4 أو WAV. تتضمن الميزات قص المقاطع، وحفظ الصور المصغرة، وإدارة القنوات المفضلة، ووضع التحميلات في قائمة انتظار، والبحث في يوتيوب مباشِرة من NVDA.

مفاتيح الاختصار:
NVDA+Y
ضغطة واحدة: تحميل MP3
ضغطتان: تحميل MP4
ثلاث ضغطات: تحميل WAV

CTRL+Shift+Y
ضغطة واحدة: فتح القائمة السياقية
ضغطتان: فتح مجلد الوجهة
ثلاث ضغطات: البحث عن فيديو

NVDA+CTRL+Y
ضغطة واحدة: قائمة التحميلات
ضغطتان: التحميلات الفاشلة
ثلاث ضغطات: تقرير سجل الفيديو

NVDA+Shift+Y
ضغطة واحدة: حفظ الوصف
ضغطتان: حفظ الترجمة
ثلاث ضغطات: قراءة ترجمات يوتيوب تلقائياً

ALT+Windows+Y
نقرة واحدة: تبديل جودة MP3
نقرة مزدوجة: تبديل وضع التنزيل الفوري
ثلاث نقرات: تبديل وضع قائمة التشغيل

Z (في صفحة يوتيوب)
تخطي الإعلانات قيد التشغيل"""