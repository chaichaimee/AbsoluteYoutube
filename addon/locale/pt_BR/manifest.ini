summary = "AbsoluteYoutube"
description = """Por que perder tempo abrindo uma página de vídeo quando você pode obtê-lo instantaneamente? Nossa atualização mais recente traz o recurso revolucionário Focar e Baixar. Basta posicionar o cursor em qualquer link de vídeo e iniciar o download imediatamente — sem precisar esperar as páginas carregarem.
Absolute YouTube permite aos usuários do NVDA pesquisar, baixar e gerenciar conteúdo do YouTube com facilidade. Baixe áudio e vídeo nos formatos MP3, MP4 ou WAV. Os recursos incluem recortar clipes, salvar miniaturas, gerenciar canais favoritos, enfileirar downloads e pesquisar no YouTube diretamente do NVDA.
Teclas de atalho:
NVDA+Y
Toque único: Baixar MP3
Toque duplo: Baixar MP4
Toque triplo: Baixar WAV

CTRL+Shift+Y
Toque único: Abrir menu de contexto
Toque duplo: Abrir pasta de destino
Toque triplo: Pesquisar vídeo

NVDA+CTRL+Y : Alternar modo de download imediato
NVDA+Shift+Y: Alternar modo de lista de reprodução
- ALT+Windows+Y: Alternar qualidade de MP3"""