summary = "AbsoluteYoutube"
description = """ດາວໂຫຼດວິດີໂອ YouTube ເປັນ MP3, MP4 ແລະ WAV ພ້ອມດ້ວຍການດາວໂຫຼດຕໍ່, ຕັດຄລິບ, ຖ່າຍພາບໜ້າຈໍ, ສຳເນົາ URL ສັ້ນ, ແລະລະບົບຈັດການການດາວໂຫຼດທີ່ລົ້ມເຫຼວແບບອັດສະລິຍະ - ໄວ ແລະ ເຂົ້າເຖິງໄດ້ງ່າຍສຳລັບຜູ້ໃຊ້ NVDA.
ເປັນຫຍັງຕ້ອງເສຍເວລາເປີດໜ້າວິດີໂອ ໃນເມື່ອເຈົ້າສາມາດດາວໂຫຼດໄດ້ທັນທີ? ການອັບເດດຫຼ້າສຸດຂອງພວກເຮົາໄດ້ນຳສະເໜີຟີເຈີ Focus and Fetch ທີ່ທັນສະໄໝ. ພຽງແຕ່ໂຟກັດເຄີເຊີຂອງທ່ານໃສ່ລິ້ງວິດີໂອໃດໜຶ່ງ ແລະເລີ່ມການດາວໂຫຼດທັນທີ - ບໍ່ຕ້ອງລໍຖ້າໃຫ້ໜ້າເວັບໂຫຼດອີກຕໍ່ໄປ.
ມີຫຍັງໃໝ່:
ເປີດ/ປິດ ໂໝດດາວໂຫຼດທັນທີ
ລະບົບຈັດການລາຍການດາວໂຫຼດ
ຊ່ອງທີ່ມັກ
ຄົ້ນຫາ Youtube
ປຸ່ມລັດ:
- NVDA+Y
ກົດໜຶ່ງຄັ້ງ: ດາວໂຫຼດ MP3
ກົດສອງຄັ້ງ: ດາວໂຫຼด MP4
ກົດສາມຄັ້ງ: ດາວໂຫຼດ WAV
- CTRL+Shift+Y
ກົດໜຶ່ງຄັ້ງ: ເປີດເມນູລັດ
ກົດສອງຄັ້ງ: ເປີດໂຟນເດີປາຍທາງ
ກົດສາມຄັ້ງ: ຄົ້ນຫາວິດີໂອ
NVDA+CTRL+Y: ເປີດ/ປິດ ໂໝດດາວໂຫຼດທັນທີ
NVDA+Shift+Y: ເປີດ/ປິດ ໂໝດລາຍການເພງ
- ALT+Windows+Y: ປ່ຽນຄຸນນະພາບ MP3"""